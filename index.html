<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İniş Rehberi</title>
<meta name="theme-color" content="#111418">
<meta name="description" content="Havalimanından çıkıştan otele, dövizden turlara: indiğin şehirde ilk gün lazım olan her şey.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İniş Rehberi">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Düzen fikri: ülkenin renkleriyle yön tabelası. Üstte bayrak şeridi, altında dokununca açılan numaralı sekmeler, tek sütun telefon akışı. */
:root{
  --paper:#eceff1; --panel:#ffffff; --ink:#14181c; --muted:#56616b; --line:#cdd4d9;
  --sign:#e8b23a; --sign-ink:#221c4a; --good:#1c7a4c; --warn:#a8500f;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1418; --panel:#192027; --ink:#edf1f3; --muted:#9ba7b1; --line:#2d3740;
    --good:#58c48f; --warn:#f0a35c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1418; --panel:#192027; --ink:#edf1f3; --muted:#9ba7b1; --line:#2d3740;
  --good:#58c48f; --warn:#f0a35c; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

.top{background:var(--sign-ink);color:#fff;padding:14px 0 0}
.top .wrap{padding-bottom:18px}
[hidden]{display:none!important}
.top .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.brand b{background:var(--sign);color:var(--sign-ink);padding:1px 7px;margin-right:6px}
.cities{display:flex;gap:6px;flex-wrap:wrap}
.city{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border:1px solid #58636d;color:#aeb8c0}
.city.on{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;margin:22px 0 8px;text-transform:uppercase;text-wrap:balance}
.lede{color:#c9d1d7;margin:0 0 14px;max-width:52ch}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.facts li{border:1px solid #58636d;padding:4px 10px;font-size:14px}
.facts b{font-family:var(--display);font-size:16px;letter-spacing:.04em;color:var(--sign);margin-right:6px}

nav{position:sticky;top:0;z-index:1200;background:var(--sign);border-bottom:2px solid var(--sign-ink)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav a{flex:none;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:var(--sign-ink);padding:4px 10px;border:2px solid transparent}
nav a:hover{border-color:var(--sign-ink)}

section{padding:26px 0 6px}
.plate{display:flex;align-items:stretch;margin:0 0 14px}
.plate .no{background:var(--sign-ink);color:var(--sign);font-family:var(--display);font-weight:700;font-size:22px;padding:6px 10px;min-width:44px;text-align:center}
.plate h2{flex:1;margin:0;background:var(--sign);color:var(--sign-ink);font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase;padding:6px 12px;line-height:1.15}
.intro{margin:0 0 14px;color:var(--muted);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px}
.card h3{margin:0 0 4px;font-size:18px;font-weight:600}
.card p{margin:6px 0 0}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.tag{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;padding:1px 8px;border:1px solid var(--line);white-space:nowrap}
.tag.where{background:var(--sign-ink);color:#fff;border-color:var(--sign-ink)}
.tag.price{font-variant-numeric:tabular-nums}
.tag.pick{background:var(--good);color:#fff;border-color:var(--good)}
.note{font-size:14px;color:var(--muted)}
.verdict{border-left:6px solid var(--good);background:var(--panel);padding:12px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.verdict b.h{display:block;font-family:var(--display);font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--good)}
.caution{border-left-color:var(--warn)}
.caution b.h{color:var(--warn)}
ul.plain{margin:6px 0 0;padding-left:18px}
ul.plain li{margin:3px 0}

.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-block;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;padding:8px 12px;background:var(--sign-ink);color:#fff;border:2px solid var(--sign-ink);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:hover{background:var(--sign);color:var(--sign-ink)}
:root[data-theme="dark"] .btn,.dk .btn{}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.alt){background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}}
:root[data-theme="dark"] .btn:not(.alt){background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}

form.go{display:grid;gap:10px}
label{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
input[type=text],select{width:100%;font:inherit;padding:10px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr} h1{font-size:36px}}

.flags{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.flag{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:6px 6px 4px;background:var(--panel);border:2px solid var(--line);font:inherit;color:var(--ink);cursor:pointer}
.flag span.f{font-size:26px;line-height:1.1}
.flag span.t{font-size:12px;font-weight:600}
.flag[aria-pressed="true"]{border-color:var(--ink);background:var(--sign);color:var(--sign-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font:inherit;font-size:14px;font-weight:600;padding:5px 10px;background:var(--panel);border:2px solid var(--line);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--sign);color:var(--sign-ink)}

table{width:100%;border-collapse:collapse;font-size:15px}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}

#map{height:340px;border:2px solid var(--ink);background:var(--panel)}
#mapnote{display:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}

footer{margin-top:30px;padding:20px 0 40px;border-top:2px solid var(--ink);font-size:14px;color:var(--muted)}
footer a{word-break:break-word}

/* Leaflet'in çalışması için gereken asgari stil */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;position:relative;-webkit-tap-highlight-color:transparent;font:13px/1.4 var(--body)}
.leaflet-container img{max-width:none!important;max-height:none!important}
.leaflet-tile{user-select:none;-webkit-user-drag:none;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-bar a{display:block;width:32px;height:32px;line-height:32px;text-align:center;text-decoration:none;background:#fff;color:#000;border:1px solid #999;font:700 18px/32px Arial}
.leaflet-control-attribution{background:rgba(255,255,255,.85);color:#333;padding:0 5px;font-size:11px}
.leaflet-control-attribution a{color:#0b57a4}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:18px}
.leaflet-popup-content-wrapper{background:#fff;color:#111;text-align:left;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.leaflet-popup-content{margin:10px 26px 10px 12px;line-height:1.35}
.leaflet-popup-content a{color:#0b57a4}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:15px;height:15px;margin:-8px auto 0;transform:rotate(45deg);background:#fff}
a.leaflet-popup-close-button{position:absolute;top:0;right:0;width:24px;height:24px;font:18px/24px Arial;text-align:center;color:#555;text-decoration:none}
.stripe{height:14px;background:linear-gradient(#a51931 0 16.66%,#f4f5f8 0 33.33%,#2d2a4a 0 66.66%,#f4f5f8 0 83.33%,#a51931 0)}
.city{background:transparent;cursor:pointer}
button.city:hover{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.crumb{margin:18px 0 0;font-family:var(--display);font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--sign)}
#where h1{margin-top:2px}
#chooser label{color:#fff}
#chooser select{border-color:var(--sign)}
.btn.gold{background:var(--sign);color:var(--sign-ink);border-color:var(--sign);font-size:18px;padding:11px 14px}
main{padding-top:14px}
details.acc{background:var(--panel);border:1px solid var(--line);margin-top:8px}
details.acc>summary{list-style:none;display:flex;align-items:stretch;cursor:pointer;min-height:54px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .no{background:var(--sign-ink);color:var(--sign);font-family:var(--display);font-weight:700;font-size:22px;min-width:54px;display:flex;align-items:center;justify-content:center}
details.acc>summary h2{flex:1;margin:0;display:flex;align-items:center;padding:8px 12px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase;line-height:1.15}
details.acc>summary .chev{width:46px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;color:var(--muted)}
details.acc>summary .chev::after{content:"+"}
details.acc[open]>summary .chev::after{content:"–"}
details.acc[open]>summary{background:var(--sign-ink);color:#fff}
details.acc[open]>summary .no{background:var(--sign);color:var(--sign-ink)}
details.acc[open]>summary .chev{color:var(--sign)}
details.acc>.body{padding:14px;border-top:4px solid var(--sign)}
.body .card,.body .verdict,.body .tw{background:var(--paper)}
.body input[type=text],.body select{background:var(--panel)}
.sub{font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin:18px 0 8px;padding-left:10px;border-left:6px solid var(--sign)}
#exitme{margin-bottom:10px}
.sight{display:flex;gap:12px;align-items:flex-start}
.ph{flex:none;width:96px;height:96px;background:var(--line);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.none{display:none}
.sx{flex:1;min-width:0}
.sx h3{margin-top:0}
details.acc>summary .no{font-size:22px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="row">
      <div class="brand"><b>→</b>İniş Rehberi</div>
      <button type="button" class="city" id="change" hidden>Yeri değiştir</button>
    </div>
    <div id="chooser">
      <h1>Nereye gidiyorsun?</h1>
      <p class="lede">Ülkeyi, şehri ve kalacağın bölgeyi seç. Rehber ona göre açılsın.</p>
      <form id="destform" class="go">
        <div><label for="d-country">Ülke</label><select id="d-country"></select></div>
        <div><label for="d-city">Şehir</label><select id="d-city"></select></div>
        <div><label for="d-zone">Kalacağın bölge</label><select id="d-zone"></select></div>
        <button type="submit" class="btn gold">Rehberi aç</button>
      </form>
    </div>
    <div id="where" hidden>
      <p class="crumb" id="crumb"></p>
      <h1 id="h1"></h1>
      <p class="lede" id="lede"></p>
      <ul class="facts" id="facts"></ul>
    </div>
  </div>
  <div class="stripe" id="stripe"></div>
</header>
<main class="wrap" id="main" hidden></main>
<footer><div class="wrap" id="foot"></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data-th.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
