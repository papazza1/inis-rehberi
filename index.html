<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İniş Rehberi</title>
<meta name="theme-color" content="#111418">
<meta name="description" content="Havalimanından çıkıştan otele, dövizden turlara: indiğin şehirde ilk gün lazım olan her şey.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İniş Rehberi">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Düzen fikri: ülkenin renkleriyle yön tabelası. Üstte bayrak şeridi, altında dokununca açılan numaralı sekmeler, tek sütun telefon akışı. */
:root{
  --paper:#eceff1; --panel:#ffffff; --ink:#14181c; --muted:#56616b; --line:#cdd4d9;
  --sign:#e8b23a; --sign-ink:#221c4a; --good:#1c7a4c; --warn:#a8500f;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1418; --panel:#192027; --ink:#edf1f3; --muted:#9ba7b1; --line:#2d3740;
    --good:#58c48f; --warn:#f0a35c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1418; --panel:#192027; --ink:#edf1f3; --muted:#9ba7b1; --line:#2d3740;
  --good:#58c48f; --warn:#f0a35c; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

.top{background:var(--sign-ink);color:#fff;padding:14px 0 0}
.top .wrap{padding-bottom:18px}
[hidden]{display:none!important}
.top .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.brand b{background:var(--sign);color:var(--sign-ink);padding:1px 7px;margin-right:6px}
.cities{display:flex;gap:6px;flex-wrap:wrap}
.city{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border:1px solid #58636d;color:#aeb8c0}
.city.on{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;margin:22px 0 8px;text-transform:uppercase;text-wrap:balance}
.lede{color:#c9d1d7;margin:0 0 14px;max-width:52ch}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.facts li{border:1px solid #58636d;padding:4px 10px;font-size:14px}
.facts b{font-family:var(--display);font-size:16px;letter-spacing:.04em;color:var(--sign);margin-right:6px}

nav{position:sticky;top:0;z-index:1200;background:var(--sign);border-bottom:2px solid var(--sign-ink)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav a{flex:none;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:var(--sign-ink);padding:4px 10px;border:2px solid transparent}
nav a:hover{border-color:var(--sign-ink)}

section{padding:26px 0 6px}
.plate{display:flex;align-items:stretch;margin:0 0 14px}
.plate .no{background:var(--sign-ink);color:var(--sign);font-family:var(--display);font-weight:700;font-size:22px;padding:6px 10px;min-width:44px;text-align:center}
.plate h2{flex:1;margin:0;background:var(--sign);color:var(--sign-ink);font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase;padding:6px 12px;line-height:1.15}
.intro{margin:0 0 14px;color:var(--muted);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px}
.card h3{margin:0 0 4px;font-size:18px;font-weight:600}
.card p{margin:6px 0 0}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.tag{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;padding:1px 8px;border:1px solid var(--line);white-space:nowrap}
.tag.where{background:var(--sign-ink);color:#fff;border-color:var(--sign-ink)}
.tag.price{font-variant-numeric:tabular-nums}
.tag.pick{background:var(--good);color:#fff;border-color:var(--good)}
.note{font-size:14px;color:var(--muted)}
.verdict{border-left:6px solid var(--good);background:var(--panel);padding:12px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.verdict b.h{display:block;font-family:var(--display);font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--good)}
.caution{border-left-color:var(--warn)}
.caution b.h{color:var(--warn)}
ul.plain{margin:6px 0 0;padding-left:18px}
ul.plain li{margin:3px 0}

.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-block;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;padding:8px 12px;background:var(--sign-ink);color:#fff;border:2px solid var(--sign-ink);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:hover{background:var(--sign);color:var(--sign-ink)}
:root[data-theme="dark"] .btn,.dk .btn{}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.alt){background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}}
:root[data-theme="dark"] .btn:not(.alt){background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}

form.go{display:grid;gap:10px}
label{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
input[type=text],select{width:100%;font:inherit;padding:10px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr} h1{font-size:36px}}

.flags{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.flag{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:6px 6px 4px;background:var(--panel);border:2px solid var(--line);font:inherit;color:var(--ink);cursor:pointer}
.flag span.f{font-size:26px;line-height:1.1}
.flag span.t{font-size:12px;font-weight:600}
.flag[aria-pressed="true"]{border-color:var(--ink);background:var(--sign);color:var(--sign-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font:inherit;font-size:14px;font-weight:600;padding:5px 10px;background:var(--panel);border:2px solid var(--line);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--sign);color:var(--sign-ink)}

table{width:100%;border-collapse:collapse;font-size:15px}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}

#map{height:340px;border:2px solid var(--ink);background:var(--panel)}
#mapnote{display:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}

footer{margin-top:30px;padding:20px 0 40px;border-top:2px solid var(--ink);font-size:14px;color:var(--muted)}
footer a{word-break:break-word}

/* Leaflet'in çalışması için gereken asgari stil */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;position:relative;-webkit-tap-highlight-color:transparent;font:13px/1.4 var(--body)}
.leaflet-container img{max-width:none!important;max-height:none!important}
.leaflet-tile{user-select:none;-webkit-user-drag:none;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-bar a{display:block;width:32px;height:32px;line-height:32px;text-align:center;text-decoration:none;background:#fff;color:#000;border:1px solid #999;font:700 18px/32px Arial}
.leaflet-control-attribution{background:rgba(255,255,255,.85);color:#333;padding:0 5px;font-size:11px}
.leaflet-control-attribution a{color:#0b57a4}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:18px}
.leaflet-popup-content-wrapper{background:#fff;color:#111;text-align:left;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.leaflet-popup-content{margin:10px 26px 10px 12px;line-height:1.35}
.leaflet-popup-content a{color:#0b57a4}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:15px;height:15px;margin:-8px auto 0;transform:rotate(45deg);background:#fff}
a.leaflet-popup-close-button{position:absolute;top:0;right:0;width:24px;height:24px;font:18px/24px Arial;text-align:center;color:#555;text-decoration:none}
.stripe{height:14px;background:linear-gradient(#a51931 0 16.66%,#f4f5f8 0 33.33%,#2d2a4a 0 66.66%,#f4f5f8 0 83.33%,#a51931 0)}
.city{background:transparent;cursor:pointer}
button.city:hover{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.crumb{margin:18px 0 0;font-family:var(--display);font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--sign)}
#where h1{margin-top:2px}
#chooser label{color:#fff}
#chooser select{border-color:var(--sign)}
.btn.gold{background:var(--sign);color:var(--sign-ink);border-color:var(--sign);font-size:18px;padding:11px 14px}
main{padding-top:14px}
details.acc{background:var(--panel);border:1px solid var(--line);margin-top:8px}
details.acc>summary{list-style:none;display:flex;align-items:stretch;cursor:pointer;min-height:54px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .no{background:var(--sign-ink);color:var(--sign);font-family:var(--display);font-weight:700;font-size:22px;min-width:54px;display:flex;align-items:center;justify-content:center}
details.acc>summary h2{flex:1;margin:0;display:flex;align-items:center;padding:8px 12px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase;line-height:1.15}
details.acc>summary .chev{width:46px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;color:var(--muted)}
details.acc>summary .chev::after{content:"+"}
details.acc[open]>summary .chev::after{content:"–"}
details.acc[open]>summary{background:var(--sign-ink);color:#fff}
details.acc[open]>summary .no{background:var(--sign);color:var(--sign-ink)}
details.acc[open]>summary .chev{color:var(--sign)}
details.acc>.body{padding:14px;border-top:4px solid var(--sign)}
.body .card,.body .verdict,.body .tw{background:var(--paper)}
.body input[type=text],.body select{background:var(--panel)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="row">
      <div class="brand"><b>→</b>İniş Rehberi</div>
      <button type="button" class="city" id="change" hidden>Yeri değiştir</button>
    </div>
    <div id="chooser">
      <h1>Nereye gidiyorsun?</h1>
      <p class="lede">Ülkeyi, şehri ve kalacağın bölgeyi seç. Rehber ona göre açılsın.</p>
      <form id="destform" class="go">
        <div><label for="d-country">Ülke</label><select id="d-country"></select></div>
        <div><label for="d-city">Şehir</label><select id="d-city"></select></div>
        <div><label for="d-zone">Kalacağın bölge</label><select id="d-zone"></select></div>
        <button type="submit" class="btn gold">Rehberi aç</button>
      </form>
    </div>
    <div id="where" hidden>
      <p class="crumb" id="crumb"></p>
      <h1 id="h1"></h1>
      <p class="lede" id="lede"></p>
      <ul class="facts" id="facts"></ul>
    </div>
  </div>
  <div class="stripe" id="stripe"></div>
</header>
<main class="wrap" id="main" hidden></main>
<footer><div class="wrap" id="foot"></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

/* ---------- oteline göre öneri (saf mantık) ---------- */
function advise(zoneId,people,late){
  const z=C.zones.find(x=>x.id===zoneId)||C.zones[C.zones.length-1];
  const fixed=z.fixed?` (${z.fixed.toLocaleString("tr-TR")} THB, 3 kişilik araç)`:"";
  const car=`Salondaki sabit fiyatlı taksi tezgâhı${fixed} ya da Grab`;
  if(z.id==="near") return {pick:"Taksi ya da Grab", why:"Otelin havalimanına birkaç kilometre. Otobüs bu yöne uğramıyor, kısa bir araç yolculuğu yeter. Oteline ücretsiz servisi olup olmadığını da sor."};
  if(z.bus==="none") return {pick:car, why:"Bu bölgeye doğrudan otobüs yok. Tezgâhtaki fiyat tablosuna bak, Grab'deki fiyatla karşılaştır, ucuz olanı al."};
  if(late) return {pick:car, why:z.bus==="smart"?"Smart Bus'ın son seferi 23:30. Gece inişinde tezgâh en zahmetsizi; sürücü aramakla uğraşmazsın.":"Phuket Town otobüsü yaklaşık 20:30'da biter. Gece için tezgâh ya da Grab."};
  if(people>=3) return {pick:car, why:`${people} kişi için otobüs ${people*100} THB tutar ama otelin kapısına bırakmaz ve uzun sürer. Araç kapıdan kapıya götürür${z.fixed?"; kişi başı yaklaşık "+Math.round(z.fixed/Math.min(people,3))+" THB'ye gelir":""}. ${people>3?"4 kişi ve üstü için SUV ya da minibüs iste.":""}`};
  if(z.bus==="town") return {pick:"Havalimanı otobüsü (100 THB)", why:"Old Town'daki 1 numaralı terminale gider, yaklaşık 1 saat 30 dakika. Terminalden otele yürü ya da kısa bir Grab çağır. Acelen varsa araç tut."};
  return {pick:"Phuket Smart Bus (100 THB)", why:`${z.n} güzergâh üzerinde. Otele en yakın durakta in, kalanını yürü ya da kısa bir Grab çağır. Yol 1,5–2 saat sürebilir; acelen ya da ağır bavulun varsa ${car.toLowerCase()} daha rahat.`};
}

    <div class="legend"><span><i class="dot" style="background:#111418"></i>Havalimanı</span><span><i class="dot" style="background:#c9a400"></i>Gezilecek yer</span><span><i class="dot" style="background:#1c7a4c"></i>Bölgeler</span><span><i class="dot" style="background:#c0392b"></i>Arama sonucu</span><span><i class="dot" style="background:#1a73e8"></i>Sen</span></div>
    <div class="btns"><button type="button" class="btn alt" id="locate">Konumumu göster</button></div><p class="note" id="mapmsg" role="status"></p><div class="stack" id="maplist"></div></div>
    <div class="verdict caution" id="mapnote"><b class="h">Harita bu önizlemede kapalı</b>Bu sayfa şu an Claude'un içinde açık ve burası dışarıdan harita yüklenmesine izin vermiyor. Sayfa kendi adresine taşındığında harita, konumun ve yakındaki yerler burada görünecek. O zamana kadar yukarıdaki düğmeler Google Haritalar'da açılır.</div></div></details>`;
  $("main").innerHTML=h;
  $("foot").innerHTML=`<p><b>Son kontrol: ${esc(C.checked)}.</b> Fiyatlar ve biniş noktaları değişir; buradaki rakamlar yaklaşık aralıktır, tabelada ve uygulamada gördüğün geçerlidir.</p><p>Kaynaklar: ${C.sources.map(s=>`<a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(" · ")}</p><p>Harita verisi © OpenStreetMap katkıcıları.</p>`;
}

/* ---------- otel formu ---------- */
function updateGo(){
  const hotel=$("hotel").value.trim(), zone=ZONE, people=+$("people").value, late=$("late").value==="1";
  const a=advise(zone,people,late);
  $("advice").innerHTML=`<b class="h">Sana önerimiz: ${esc(a.pick)}</b>${esc(a.why)}`;
  const z=C.zones.find(x=>x.id===zone);
  const dest=hotel?hotel+", "+C.name:(z&&z.id!=="other"?z.n.split(" /")[0]+", "+C.name:C.name);
  $("gobtns").innerHTML=`<button type="button" class="btn" id="routebtn">Rotayı haritada çiz</button>`+link(gDir(dest,"transit"),"Adım adım otobüs tarifi (Google)",1);
  $("routebtn").addEventListener("click",()=>routeTo(hotel,z));
  store.set("hotel",hotel);
}

/* ---------- yemek ---------- */
let cui=1, diet=-1;
function updateFood(){
  document.querySelectorAll("#flags .flag").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.i===cui)));
  document.querySelectorAll("#diets .chip").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.i===diet)));
  const c=CUISINES[cui], d=diet>=0?DIETS[diet]:null;
  const q=(d?d.q+" ":"")+c.q, label=(d?d.t.toLowerCase()+" ":"")+c.t;
  $("foodbtns").innerHTML=`<button type="button" class="btn" id="foodmap">${esc(label)} restoranlarını haritada göster</button>`+link(gSearch(q),"Google puanlarıyla aç",1);
  $("foodmap").addEventListener("click",()=>{ const sel='nwr["amenity"~"restaurant|fast_food|cafe"]["cuisine"~"'+c.o+'",i]'+(d&&d.o.indexOf("cuisine")<0?d.o:""); overpass(sel,label+" restoranları"); });
  store.set("cui",String(cui));
}

/* ---------- harita ---------- */
let map=null, results=null, me=null, meLL=null, mapDead=false, sightPins=[], lastItems=null, ZONE=null;
function zoneLL(){ const z=C.zones.find(x=>x.id===ZONE); return z&&z.ll?z.ll:null; }
function zoneName(){ const z=C.zones.find(x=>x.id===ZONE); return z&&z.id!=="other"?z.n.split(" /")[0].split(" (")[0]:C.name; }
function mapFail(){ $("mapwrap").style.display="none"; $("mapnote").style.display="block"; mapDead=true; }
function initMap(){
  if(typeof L==="undefined") return mapFail();
  try{
    map=L.map("map",{scrollWheelZoom:false}).setView(zoneLL()||C.center,zoneLL()?13:C.zoom);
    let loaded=0;
    const tiles=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'});
    tiles.on("tileload",()=>{loaded++;});
    tiles.addTo(map);
    setTimeout(()=>{ if(!loaded) mapFail(); },6000);
    const pin=(ll,color,html,r)=>L.circleMarker(ll,{radius:r||7,color:"#fff",weight:2,fillColor:color,fillOpacity:1}).addTo(map).bindPopup(html);
    pin(C.airport.ll,"#111418","<b>"+esc(C.airport.name)+"</b>",9);
    sightPins=C.sights.map(s=>pin(s.ll,"#c9a400","<b>"+esc(s.t)+"</b><br>"+esc(s.d)+'<br><a href="'+esc(gPlace(s.t))+'" target="_blank" rel="noopener">Google Haritalar\'da aç</a>'));
    C.zones.filter(z=>z.ll).forEach(z=>pin(z.ll,"#1c7a4c","<b>"+esc(z.n)+"</b>",6));
    results=L.layerGroup().addTo(map);
  }catch(e){ mapFail(); }
}
function showMap(){ const d=$("harita"); d.open=true; if(!map&&!mapDead) initMap(); d.scrollIntoView(); if(map) setTimeout(()=>map.invalidateSize(),80); }
function dist(a,b){ const R=6371000,t=Math.PI/180,dl=(b[0]-a[0])*t,dn=(b[1]-a[1])*t; const x=Math.sin(dl/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
const fmtD=m=>m<1000?Math.round(m/10)*10+" m":(m/1000).toFixed(1).replace(".",",")+" km";
function drawList(){
  const list=$("maplist"); if(!lastItems){ list.innerHTML=""; return; }
  const ref=meLL||zoneLL();
  if(ref){ lastItems.forEach(it=>it.d=dist(ref,it.ll)); lastItems.sort((a,b)=>a.d-b.d); }
  list.innerHTML=lastItems.slice(0,8).map((it,i)=>`<div class="card"><h3>${esc(it.name)}</h3><div class="meta">${it.d!=null?`<span class="tag price">${meLL?fmtD(it.d)+" uzakta":esc(zoneName())+" merkezine "+fmtD(it.d)}</span>`:""}</div><div class="btns"><button type="button" class="btn alt" data-r="${i}">Haritada göster</button></div></div>`).join("");
}
function focusSight(i){ showMap(); if(!map||mapDead) return; map.setView(C.sights[i].ll,15); if(sightPins[i]) sightPins[i].openPopup(); }
async function overpass(selector,label){
  showMap();
  if(!map||mapDead){ return; }
  const msg=$("mapmsg"); lastItems=null; drawList(); msg.textContent=label+" aranıyor…";
  const q="[out:json][timeout:20];"+selector+"("+C.bbox.join(",")+");out center 120;";
  try{
    const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+enc(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json(); results.clearLayers();
    const items=[];
    (j.elements||[]).forEach(e=>{
      const lat=e.lat||(e.center&&e.center.lat), lon=e.lon||(e.center&&e.center.lon); if(!lat) return;
      const name=(e.tags&&(e.tags["name:en"]||e.tags.name))||label;
      const m=L.circleMarker([lat,lon],{radius:7,color:"#fff",weight:2,fillColor:"#c0392b",fillOpacity:1}).addTo(results)
        .bindPopup("<b>"+esc(name)+'</b><br><a href="https://www.google.com/maps/search/?api=1&query='+enc(name+" "+C.name)+'" target="_blank" rel="noopener">Google\'da puanını gör</a>');
      items.push({name:name,ll:[lat,lon],m:m,d:null});
    });
    if(items.length){
      lastItems=items; drawList();
      const ref=meLL||zoneLL();
      const fit=ref?lastItems.slice(0,10).map(i=>i.ll).concat([ref]):items.map(i=>i.ll);
      map.fitBounds(fit,{padding:[30,30],maxZoom:15});
      msg.textContent=items.length+" yer bulundu: "+label+". "+(meLL?"Sana en yakınlar aşağıda sıralı.":(ref?zoneName()+" merkezine en yakınlar aşağıda. ":"")+"'Konumumu göster'e basarsan sana göre sıralanır.");
    } else msg.textContent="Açık haritada kayıtlı "+label+" bulunamadı. Google düğmesini dene; Google'ın listesi daha geniştir.";
  }catch(e){ msg.textContent="Arama şu an yapılamadı. Biraz sonra tekrar dene."; }
}
async function routeTo(hotel,z){
  showMap(); if(!map||mapDead) return;
  const msg=$("mapmsg"); lastItems=null; drawList(); results.clearLayers(); msg.textContent="Rota hesaplanıyor…";
  try{
    let dest=null, name=hotel, approx=false;
    if(hotel){
      const vb=[C.bbox[1],C.bbox[2],C.bbox[3],C.bbox[0]].join(",");
      const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&bounded=1&viewbox="+vb+"&q="+enc(hotel));
      const j=await r.json(); if(j&&j[0]) dest=[+j[0].lat,+j[0].lon];
    }
    if(!dest&&z&&z.ll){ dest=z.ll; approx=true; name=z.n; }
    if(!dest){ msg.textContent="Oteli açık haritada bulamadım. Adını İngilizce ve tam yaz ya da bölgeyi seç."; return; }
    const a=C.airport.ll;
    const r2=await fetch("https://router.project-osrm.org/route/v1/driving/"+a[1]+","+a[0]+";"+dest[1]+","+dest[0]+"?overview=full&geometries=geojson");
    const j2=await r2.json(); const rt=j2.routes&&j2.routes[0]; if(!rt) throw new Error("rota yok");
    const line=L.geoJSON(rt.geometry,{style:{color:"#1a73e8",weight:5,opacity:.85}}).addTo(results);
    L.circleMarker(dest,{radius:9,color:"#fff",weight:3,fillColor:"#c0392b",fillOpacity:1}).addTo(results).bindPopup("<b>"+esc(name)+"</b>").openPopup();
    map.fitBounds(line.getBounds(),{padding:[30,30]});
    msg.textContent=(approx?(hotel?"Oteli açık haritada bulamadım, "+name+" merkezine göre çizdim. ":name+" merkezine göre çizdim. "):"")+"Havalimanından "+Math.round(rt.distance/1000)+" km, trafiksiz yaklaşık "+Math.round(rt.duration/60)+" dk araç yolu.";
  }catch(e){ msg.textContent="Rota şu an çizilemedi. Biraz sonra tekrar dene."; }
}
function locate(){
  const msg=$("mapmsg");
  if(!navigator.geolocation||!map){ msg.textContent="Bu cihazda konum alınamıyor."; return; }
  msg.textContent="Konumun alınıyor…";
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude]; meLL=ll;
    if(me) map.removeLayer(me);
    me=L.circleMarker(ll,{radius:9,color:"#fff",weight:3,fillColor:"#1a73e8",fillOpacity:1}).addTo(map).bindPopup("Buradasın");
    map.setView(ll,14); msg.textContent="Konumun haritada mavi nokta olarak işaretlendi."+(lastItems?" Liste sana en yakına göre sıralandı.":""); drawList();
  },()=>{ msg.textContent="Konum izni verilmedi. Tarayıcı ayarlarından izin verip tekrar dene."; },{enableHighAccuracy:true,timeout:10000});
}

/* ---------- canlı kur (ücretsiz servis; ulaşılamazsa kart görünmez) ---------- */
async function loadRate(){
  try{
    const r=await fetch("https://api.frankfurter.app/latest?from=USD&to=THB,TRY,EUR");
    if(!r.ok) return; const j=await r.json(); if(!j.rates||!j.rates.THB) return;
    const thb=j.rates.THB, rows=[["1 dolar",thb],["1 avro",j.rates.EUR?thb/j.rates.EUR:null],["100 Türk lirası",j.rates.TRY?thb/j.rates.TRY*100:null]].filter(x=>x[1]);
    const el=$("rate"); el.hidden=false;
    el.innerHTML="<h3>Bugünkü piyasa kuru</h3><div class=\"meta\">"+rows.map(x=>`<span class="tag price">${esc(x[0])} = ${x[1].toFixed(2)} THB</span>`).join("")+`</div><p class="note">${esc(j.date)} tarihli orta kur. Döviz bürosu bundan biraz düşüğünü verir; tabeladaki rakam buna ne kadar yakınsa kur o kadar iyidir.</p>`;
  }catch(e){}
}

/* ---------- başlat ---------- */
render();
function applyDest(zid){
  ZONE=zid; store.set("zone",zid);
  const z=C.zones.find(x=>x.id===zid), zn=zoneName();
  $("chooser").hidden=true; $("where").hidden=false; $("change").hidden=false; $("main").hidden=false;
  $("crumb").textContent=C.flag+" "+C.country;
  $("h1").textContent=z.id==="other"?C.name:C.name+" · "+zn;
  $("lede").textContent=C.lede;
  $("facts").innerHTML=[["Havalimanı",C.airport.code],...C.facts,["Son kontrol",C.checked]].map(f=>`<li><b>${esc(f[0])}</b>${esc(f[1])}</li>`).join("");
  const a=advise(zid,2,false);
  $("exitme").innerHTML=`<b class="h">${esc(zn)} için kısa cevap: ${esc(a.pick)}</b>${esc(a.why)} <span class="note">İki kişi ve gündüz inişine göre. Kendi durumun için 02 numaralı sekmeye bak.</span>`;
  updateGo();
  if(map){ const ll=zoneLL(); if(ll) map.setView(ll,13); }
  window.scrollTo(0,0);
}
function applyTheme(){
  const t=C.theme; if(!t) return; const s=document.documentElement.style;
  s.setProperty("--sign",t.accent); s.setProperty("--sign-ink",t.ink); $("stripe").style.background=t.stripe;
}
applyTheme();
$("d-country").innerHTML=`<option value="th">${esc(C.flag+" "+C.country)}</option><option disabled>Diğer ülkeler yakında</option>`;
$("d-city").innerHTML=`<option value="${C.id}">${esc(C.name)}</option><option disabled>Bangkok (yakında)</option><option disabled>Chiang Mai (yakında)</option>`;
$("d-zone").innerHTML=C.zones.map(z=>`<option value="${z.id}">${esc(z.n)}</option>`).join("");
$("destform").addEventListener("submit",e=>{ e.preventDefault(); applyDest($("d-zone").value); });
$("change").addEventListener("click",()=>{ $("chooser").hidden=false; $("where").hidden=true; $("main").hidden=true; $("change").hidden=true; if(ZONE) $("d-zone").value=ZONE; window.scrollTo(0,0); });
const sh=store.get("hotel"), sz=store.get("zone"), sc=store.get("cui");
if(sh) $("hotel").value=sh;
if(sc!==null&&CUISINES[+sc]) cui=+sc;
["hotel","people","late"].forEach(id=>$(id).addEventListener("input",updateGo));
$("goform").addEventListener("submit",e=>e.preventDefault());
$("flags").addEventListener("click",e=>{const b=e.target.closest(".flag"); if(!b) return; cui=+b.dataset.i; updateFood();});
$("diets").addEventListener("click",e=>{const b=e.target.closest(".chip"); if(!b) return; const i=+b.dataset.i; diet=(diet===i?-1:i); updateFood();});
updateFood();
document.querySelectorAll(".onmap").forEach(b=>b.addEventListener("click",()=>{const n=C.needs[+b.dataset.need]; overpass(n.osm,n.t);}));
$("locate").addEventListener("click",locate);
$("main").addEventListener("click",e=>{const b=e.target.closest("[data-act]"); if(!b) return; if(b.dataset.act==="sight") focusSight(+b.dataset.i); else if(b.dataset.act==="fx") overpass('nwr["amenity"="bureau_de_change"]',"döviz büroları");});
$("maplist").addEventListener("click",e=>{const b=e.target.closest("[data-r]"); if(!b||!lastItems) return; const it=lastItems[+b.dataset.r]; if(!it) return; $("map").scrollIntoView({block:"center"}); map.setView(it.ll,16); it.m.openPopup();});
document.querySelectorAll("details.acc").forEach(d=>d.addEventListener("toggle",()=>{
  if(!d.open) return;
  if(d.id==="harita"){ if(!map&&!mapDead) initMap(); else if(map) setTimeout(()=>map.invalidateSize(),60); return; }
  document.querySelectorAll("details.acc[open]").forEach(o=>{ if(o!==d&&o.id!=="harita") o.open=false; });
  d.scrollIntoView({block:"start"});
}));
if(sz&&C.zones.some(z=>z.id===sz)) applyDest(sz);
loadRate();
</script>
